    <lightning-card

        <div class="slds-p-around_medium">

            <p class="slds-m-bottom_small">

                <strong>Application Date:</strong>

                {application.Application_Date__c}

            <p class="slds-m-bottom_small">

                <strong>Status:</strong>

                <c-status-badge

            </p>

        </div>

    </lightning-card>

</template>
